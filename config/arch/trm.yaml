name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: False
puzzle_emb_len: 1
no_ACT_continue: True

# ----------------------------
# Dropout (NEW)
# ----------------------------
# If you implement the "bimamba_v2_dropout" mode, use these:
mamba_dropout_p: 0.10          # single knob (recommended)
# OR, if you implement separate knobs instead:
# resid_drop: 0.10       # dropout on residual branches (mamba/attn)
# mlp_drop: 0.10         # dropout on MLP branch

# ----------------------------
# Mamba hyperparameters
# ----------------------------
mamba_d_state: 64
mamba_d_conv: 1
mamba_expand: 4.0
mamba_dt_rank: auto

# ----------------------------
# Modes (exactly one should be true)
# ----------------------------
mamba_bimamba_v2_with_transformer: False
mamba_bimamba_with_transformer_and_nn: False
mamba_two_stage: False
mamba_bimamba_v2: False

# NEW mode you asked for
mamba_bimamba_v2_dropout: True

mamba_if_divide_out: True

mamba_bimamba_heads_transformer_nn: False
mamba_bimamba_heads: 8
mamba_bimamba_heads_out_proj: True

# Turn this OFF since we're switching to bimamba_v2_dropout
state_dep_dual_mamba: False

bilstm_with_nn: False
bilstm_hidden_size: 512
bilstm_num_layers: 1
bilstm_downproj_bias: False




